; PlatformIO Project Configuration — Waveshare 13.3" Spectra 6 Calendar
; Target MCU: standard ESP32 dev board (e.g. ESP32 DevKitC / DOIT 38-pin)
;
; !! IMPORTANT — RAM !!
; 1600 × 1200 = 1 920 000 pixels.  We never allocate a full frame buffer;
; the driver sends one row (800 bytes) at a time, so RAM usage is tiny.
; A vanilla ESP32 (520 KB SRAM) is perfectly adequate.
;
; If you later want to do image pre-processing or dithering in-memory you
; may need an ESP32-S3 with PSRAM, but for text-only calendar rendering
; the standard ESP32 is fine.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson@^7.0.0

build_flags =
  -DCORE_DEBUG_LEVEL=1

; The source filter keeps only the spectra6 main + shared files.
; Rename / remove this if you want the build system to pick up all .cpp files.
build_src_filter =
  +<*.cpp>
  +<*.h>
  -<main_gooddisplay.cpp>
